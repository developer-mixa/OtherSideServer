[project]
name = "otherside-api"
version = "0.1.0"
description = "OtherSide FastAPI backend with Clean Architecture"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.161.1",
    # Imported directly by the middleware, so pinned rather than left to fastapi's range.
    "starlette==1.7.0",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy[asyncio]==2.0.55",
    "asyncpg==0.32.0",
    "alembic==1.20.1",
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    "pyjwt==2.15.1",
    "pwdlib[argon2,bcrypt]==0.3.1",
    "anyio==4.15.1",
    "dishka==1.10.1",
    "httpx==0.28.1",
    "email-validator==2.3.0",
    "aiosmtplib==5.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.2",
    "mypy==1.13.0",
    "pre-commit==4.6.2",
    "testcontainers[postgres]==4.15.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.2",
    "mypy==1.13.0",
    "pre-commit==4.6.2",
    "testcontainers[postgres]==4.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/domain",
    "src/application",
    "src/presentation",
    "src/infrastructure",
    "src/config",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: needs PostgreSQL (testcontainers or TEST_DATABASE_URL); applied automatically",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["src/main.py"]

[tool.coverage.report]
fail_under = 83
show_missing = true

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["domain", "application", "presentation", "infrastructure", "config"]
