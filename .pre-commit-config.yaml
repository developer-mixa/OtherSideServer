repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic==2.14.1
          - pydantic-settings==2.15.0
          - sqlalchemy==2.0.54
          - fastapi==0.143.1
          - pyjwt==2.15.1
          - pwdlib[argon2,bcrypt]==0.3.1
          - anyio==4.15.1
