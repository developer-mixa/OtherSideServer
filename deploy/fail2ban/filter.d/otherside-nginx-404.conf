# Matches any 404 response in nginx's access log. Used to auto-ban IPs doing the
# constant background scanning every public host gets (.env, firebase-adminsdk.json,
# wp-login.php, /owa/, backup.sql, ...). Legitimate clients rarely rack up 15 x 404
# in 5 minutes, so this is safe with a generous threshold — see jail.d/otherside-nginx-404.conf.
[Definition]
failregex = ^<HOST> -.*"(GET|POST|HEAD|PUT|DELETE|OPTIONS) \S+ HTTP/\d\.\d" 404
ignoreregex =
