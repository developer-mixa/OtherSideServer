# api.otherside-inc.ru — reverse proxy for OtherSideServer (FastAPI on 127.0.0.1:8000).
#
# Source of truth for /etc/nginx/sites-available/otherside-api on the prod server.
# Certbot manages the `listen 443 ssl` block and the HTTP->HTTPS redirect server below —
# if you re-run `certbot --nginx`, it will rewrite those parts; keep this file in sync
# by hand afterwards (see deploy/README.md).

server {
    server_name api.otherside-inc.ru;

    client_max_body_size 20m;

    # Only the real API surface and the health check are proxied to the app.
    # Everything else (scanner probes for .env, wp-login.php, firebase keys, /owa/,
    # backup.sql, ...) gets a flat 404 from nginx itself and never reaches uvicorn.
    location ~ ^/(api/|health$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/otherside-inc.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/otherside-inc.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = api.otherside-inc.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name api.otherside-inc.ru;
    return 404; # managed by Certbot
}
